name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build addon
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build demo Storybook (examples/storybook-10)
        run: |
          cd examples/storybook-10
          yarn install
          yarn build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/storybook-10/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
